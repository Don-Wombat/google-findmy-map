; Five long-running processes, one container: a virtual X display, a
; minimal window manager, a VNC server, the VNC-over-websocket bridge
; (websockify, also serving the noVNC static client), and this image's own
; FastAPI control app. nginx (started separately, see below) is the single
; process actually reachable from outside the container; everything else
; listens on 127.0.0.1 only.
;
; supervisord runs non-root here (entrypoint.sh has already dropped to
; PUID:PGID before exec'ing it) -- none of these processes need root:
; chromium is launched with --no-sandbox (see the vendored chrome_driver.py)
; specifically because a Chrome sandbox needs setuid-root helpers this
; container deliberately doesn't grant.
;
; Per-program logs go to plain files under /tmp, not /dev/stdout/stderr:
; confirmed empirically that supervisord running as a non-root PID 1 can't
; open /dev/stdout for a child (it resolves through /proc/self/fd/1, whose
; permissions PID 1's own non-root UID doesn't have access to from a
; forked child's perspective) -- every program failed to spawn at all
; ("unknown error making dispatchers: EACCES") until this was changed.
; Inspect a program's output with:
;   docker exec <container> cat /tmp/<program>.log

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.log

[program:windowmanager]
command=fluxbox -display :99
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/tmp/windowmanager.log
stderr_logfile=/tmp/windowmanager.log

[program:x11vnc]
; -localhost: binds to loopback only. This container may end up on the same
; Docker network as other services (proxy-net) -- without -localhost,
; anything else on that network could reach the raw VNC port directly,
; bypassing nginx and the setup-token gate entirely. -nopw is only
; acceptable because of -localhost, not instead of it.
command=/bin/sh -c "for i in $(seq 1 100); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.2; done; exec x11vnc -display :99 -rfbport 5900 -localhost -nopw -forever -shared -noxdamage"
autorestart=true
priority=30
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.log

[program:websockify]
; --web serves the static noVNC client too, so nginx only has to proxy one
; upstream (127.0.0.1:6080) for both the HTML/JS viewer and the actual
; websocket-to-VNC bridge under /vnc/.
command=websockify --web=/usr/share/novnc 127.0.0.1:6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify.log

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=50
stdout_logfile=/tmp/nginx.log
stderr_logfile=/tmp/nginx.log

[program:wizard]
; Inherits supervisord's own environment (incl. SETUP_TOKEN, PUID, PGID,
; GFM_SETUP_TOKEN_TTL, GFM_SETUP_RUN_TIMEOUT_SECONDS -- see entrypoint.sh
; and docker-compose.yml) with no environment= needed here; DISPLAY and
; GFM_VENDOR_DIR are the only values specific to this program.
; The plain "uvicorn" console-script, not "python3 -m uvicorn" -- this
; install has no uvicorn/__main__.py, confirmed empirically ("No module
; named uvicorn.__main__; 'uvicorn' is a package and cannot be directly
; executed").
command=/usr/local/bin/uvicorn main:app --host 127.0.0.1 --port 5000
directory=/app/setup-app
environment=DISPLAY=":99",GFM_VENDOR_DIR="/app/vendor"
autorestart=true
priority=60
stopsignal=TERM
stdout_logfile=/tmp/wizard.log
stderr_logfile=/tmp/wizard.log
