# Single external entry point for this container: path-based routing to two
# localhost-only upstreams (the wizard's own FastAPI app, and websockify's
# VNC-over-websocket bridge + noVNC static client). Neither upstream is
# reachable directly from outside the container -- only this port is.
#
# Runs non-root (see supervisord.conf's header comment), hence pid/log
# paths under /tmp rather than the Debian package's root-owned defaults,
# and no "user" directive (meaningless without root, nginx would only warn).

pid /tmp/nginx.pid;
# The bare "stderr" keyword, not a "/dev/stderr" path: the latter is a
# fresh open() through /proc/self/fd/2, which fails the same way /dev/
# stdout does for supervisord's own per-program logging in this gosu-
# based, non-root setup (see entrypoint.sh's comment on the tail -F
# forwarder for the full explanation) -- "stderr" instead writes directly
# to the already-inherited fd 2, no reopen involved.
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Custom format instead of nginx's default "combined": that default logs
    # $request, the full request line including the query string -- which
    # would put the one-time SETUP_TOKEN from a "?token=..." redemption
    # request into this file in plaintext. This drops the query string
    # ($uri, not $request_uri) so SECURITY.md's "these logs carry no token/
    # credential values" claim actually holds for nginx's own access log
    # too, not just for run_flow.py's emitted stage messages.
    log_format no_query '$remote_addr - [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    # A plain file, not off: every request hitting this container's single
    # entry point, useful when debugging the token gate or /vnc/ routing.
    # Forwarded into `docker logs` the same way the other programs' logs
    # are (see entrypoint.sh).
    access_log /tmp/nginx.log no_query;
    # All of nginx's temp-file paths, not just the two this config actually
    # exercises: nginx validates/creates every one of these at startup
    # regardless of whether fastcgi/uwsgi/scgi are ever proxied to, and the
    # Debian package's compiled-in defaults (/var/lib/nginx/*) are
    # root-owned -- confirmed empirically ("mkdir() ... failed (13:
    # Permission denied)") for a non-root master process otherwise.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8090;

        # Internal-only: nginx's auth_request module calls this for /vnc/
        # to ask the wizard app whether the current cookie is a valid
        # session. websockify itself has no notion of our session cookie,
        # so the gate has to live in front of it, not in it.
        location = /api/auth-check {
            internal;
            proxy_pass http://127.0.0.1:5000/api/auth-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location /vnc/ {
            auth_request /api/auth-check;
            proxy_pass http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
