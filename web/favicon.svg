<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Dark rounded-square backdrop, matching the app's dark theme (--bg). -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#14161a"/>
  <!-- Faint location-pulse ring. -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#4e9bff" stroke-opacity="0.35" stroke-width="1.6"/>
  <!-- The device marker itself: same white-ring-over-accent-blue-dot glyph
       the map uses for a live device fix (see drawDevice() in web/index.html). -->
  <circle cx="16" cy="16" r="9" fill="#ffffff"/>
  <circle cx="16" cy="16" r="7" fill="#4e9bff"/>
</svg>
