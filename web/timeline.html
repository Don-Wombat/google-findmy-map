<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="page_title_timeline">FindMy Map – Timeline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="app.css" />
<script src="app.js"></script>
</head>
<body>
<div id="poll-alert" class="poll-alert" hidden></div>
<div id="app">
  <div id="map"></div>
  <aside id="sidebar">
    <div id="sidebar-header">
      <button id="sheet-toggle" type="button" data-i18n-aria="toggle_sheet" aria-label="Collapse / expand panel"></button>
      <div class="header-row">
        <h1 data-i18n="timeline_heading">Timeline</h1>
        <a id="settings-link" class="icon-btn" href="settings.html" data-i18n-aria="settings" aria-label="Settings">⚙</a>
      </div>
      <a class="btn" href="index.html" data-i18n="back_to_map">← Back to map</a>
    </div>
    <div class="sidebar-body">
      <div class="field">
        <label for="device" data-i18n="f_device">Device</label>
        <select id="device"></select>
      </div>

      <div class="seg" id="range-mode">
        <button type="button" data-value="day" data-i18n="range_day">Day</button>
        <button type="button" data-value="week" data-i18n="range_week">Week</button>
        <button type="button" data-value="month" data-i18n="range_month">Month</button>
        <button type="button" data-value="range" data-i18n="range_custom">Range</button>
      </div>

      <div class="field" id="anchor-field">
        <div class="anchor-row">
          <button type="button" id="prev-btn" class="step-btn" data-i18n-aria="range_prev" aria-label="Previous">&#8249;</button>
          <input type="date" id="anchor">
          <button type="button" id="next-btn" class="step-btn" data-i18n-aria="range_next" aria-label="Next">&#8250;</button>
        </div>
        <div id="range-label" class="muted"></div>
      </div>

      <div id="custom-field" hidden>
        <div class="field">
          <label for="from" data-i18n="f_from">From</label>
          <input type="date" id="from">
        </div>
        <div class="field">
          <label for="to" data-i18n="f_to">To</label>
          <input type="date" id="to">
        </div>
      </div>

      <button id="show-btn" class="btn btn-primary" type="button" data-i18n="show">Show</button>
      <div id="status" class="muted" style="margin-top: 12px;"></div>
      <div id="visits" class="visits" hidden>
        <h2 data-i18n="visited_places">Visited places</h2>
        <div id="visits-note" class="visits-note"></div>
        <div id="visits-list"></div>
      </div>
      <div id="export" class="export" hidden>
        <h2 data-i18n="s_export">Data export</h2>
        <div class="export-row">
          <span data-i18n="export_track">Track</span>
          <a id="exp-track-gpx" download>GPX</a>
          <a id="exp-track-geojson" download>GeoJSON</a>
          <a id="exp-track-csv" download>CSV</a>
        </div>
        <div class="export-row" id="export-visits-row" hidden>
          <span data-i18n="export_visits">Visited places</span>
          <a id="exp-visits-gpx" download>GPX</a>
          <a id="exp-visits-geojson" download>GeoJSON</a>
          <a id="exp-visits-csv" download>CSV</a>
        </div>
      </div>
    </div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([51.1657, 10.4515], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const layer = L.layerGroup().addTo(map);
const visitLayer = L.layerGroup().addTo(map);
const deviceColors = new Map();
let visitsRun = 0;   // bumped on each show() so stale geocode retries stop

// The visited-places list is capped so the "Data export" section below it
// stays reachable without a long scroll. "Show more" expands it in place.
const VISITS_PAGE = 6;
let visitsExpanded = false;

const t = (k, v) => window.FindMyMap.t(k, v);
const loc = () => window.FindMyMap.locale();

function fmtTime(unixSeconds) {
  if (!unixSeconds) return t('unknown');
  return new Date(unixSeconds * 1000).toLocaleString(loc());
}

function fmtClock(ts) {
  return new Date(ts * 1000).toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' });
}

function fmtDay(ts) {
  return new Date(ts * 1000).toLocaleDateString(loc(),
    { weekday: 'short', day: '2-digit', month: '2-digit' });
}

function fmtDuration(seconds) {
  const m = Math.round(seconds / 60);
  if (m < 60) return `${m} ${t('unit_min')}`;
  const h = Math.floor(m / 60);
  return m % 60 ? `${h} ${t('unit_hour')} ${m % 60} ${t('unit_min')}` : `${h} ${t('unit_hour')}`;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function toDateInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function setStatus(html) {
  document.getElementById('status').innerHTML = html;
}

// Keep the auto-fit clear of the floating panel (top-right on desktop).
function fitPadding() {
  return window.matchMedia('(min-width: 641px)').matches
    ? { paddingTopLeft: [60, 60], paddingBottomRight: [330, 60] }
    : { padding: [50, 50] };
}

// Great-circle distance in metres, for thinning dense marker clusters.
function metres(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2
    + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function loadDevices() {
  const sel = document.getElementById('device');
  let devicesBody, locState;
  try {
    // /api/devices lists every device ever seen (so one that has since
    // dropped out of the live poll stays reachable here); /api/locations
    // is only consulted for its per-device pin colour, best-effort.
    [devicesBody, locState] = await Promise.all([
      fetch('/api/devices').then(r => r.json()),
      fetch('/api/locations').then(r => r.json()),
    ]);
  } catch (e) {
    setStatus(`<span class="error-row">${t('server_unreachable')}</span>`);
    return;
  }
  for (const d of (locState.devices || [])) {
    deviceColors.set(d.id, d.color || '#4e9bff');
  }
  const devices = (devicesBody.devices || []).slice()
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  const named = [...new Set(devices.map(d => d.group).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
  const mkOpt = d => {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.name || d.id;
    return o;
  };
  for (const g of named) {
    const og = document.createElement('optgroup');
    og.label = g;
    for (const d of devices.filter(d => d.group === g)) og.appendChild(mkOpt(d));
    sel.appendChild(og);
  }
  for (const d of devices.filter(d => !d.group)) sel.appendChild(mkOpt(d));

  if (!devices.length) setStatus(t('no_devices'));
}

// ---- date range: Day / Week / Month step-through, or a free Range --------
const RANGE_MODES = ['day', 'week', 'month', 'range'];
let rangeMode = (() => {
  try { const v = localStorage.getItem('fmm.rangeMode'); if (RANGE_MODES.includes(v)) return v; } catch (e) {}
  return 'day';
})();
let anchor = (() => {
  try {
    const v = localStorage.getItem('fmm.anchor');
    if (v) { const d = new Date(v + 'T12:00:00'); if (!isNaN(d)) return d; }
  } catch (e) {}
  return new Date();
})();

function persistDateState() {
  try {
    localStorage.setItem('fmm.rangeMode', rangeMode);
    localStorage.setItem('fmm.anchor', toDateInput(anchor));
  } catch (e) {}
}

function selectedRange() {
  if (rangeMode === 'range') {
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;
    return {
      start: from ? Math.floor(new Date(from + 'T00:00:00').getTime() / 1000) : '',
      end:   to   ? Math.floor(new Date(to   + 'T23:59:59').getTime() / 1000) : '',
    };
  }
  const s = new Date(anchor), e = new Date(anchor);
  if (rangeMode === 'week') {
    const dow = (anchor.getDay() + 6) % 7;   // Mon = 0
    s.setDate(anchor.getDate() - dow);
    e.setDate(s.getDate() + 6);
  } else if (rangeMode === 'month') {
    s.setDate(1);
    e.setMonth(anchor.getMonth() + 1, 0);
  }
  s.setHours(0, 0, 0, 0);
  e.setHours(23, 59, 59, 999);
  return { start: Math.floor(s.getTime() / 1000), end: Math.floor(e.getTime() / 1000) };
}

function rangeLabel() {
  const { start, end } = selectedRange();
  const s = new Date(start * 1000);
  if (rangeMode === 'day')
    return s.toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if (rangeMode === 'month')
    return s.toLocaleDateString(loc(), { month: 'long', year: 'numeric' });
  const e = new Date(end * 1000), opt = { day: 'numeric', month: 'short' };
  return `${s.toLocaleDateString(loc(), opt)} – ${e.toLocaleDateString(loc(), opt)}`;
}

function syncDateInputs() {
  const custom = rangeMode === 'range';
  document.getElementById('anchor-field').hidden = custom;
  document.getElementById('custom-field').hidden = !custom;
  document.querySelectorAll('#range-mode button').forEach(b =>
    b.classList.toggle('active', b.dataset.value === rangeMode));
  if (!custom) {
    document.getElementById('anchor').value = toDateInput(anchor);
    document.getElementById('range-label').textContent = rangeLabel();
  }
}

function stepRange(dir) {
  const d = new Date(anchor);
  if (rangeMode === 'day') d.setDate(d.getDate() + dir);
  else if (rangeMode === 'week') d.setDate(d.getDate() + 7 * dir);
  else if (rangeMode === 'month') { d.setDate(1); d.setMonth(d.getMonth() + dir); }
  anchor = d;
  syncDateInputs();
  persistDateState();
  show();
}

function exportHref(kind, id, start, end, format) {
  const p = new URLSearchParams({ device: id, format: format });
  if (start) p.set('start', start);
  if (end) p.set('end', end);
  return `/api/export/${kind}?${p}`;
}

function updateExportLinks(id, start, end, hasTrack) {
  const box = document.getElementById('export');
  box.hidden = !(id && hasTrack);
  if (box.hidden) return;
  for (const fmt of ['gpx', 'geojson', 'csv']) {
    document.getElementById('exp-track-' + fmt).href = exportHref('history', id, start, end, fmt);
    document.getElementById('exp-visits-' + fmt).href = exportHref('visits', id, start, end, fmt);
  }
}

async function show() {
  const id = document.getElementById('device').value;
  if (!id) return;
  const { start, end } = selectedRange();
  const btn = document.getElementById('show-btn');
  btn.disabled = true;
  btn.textContent = t('loading_short');
  visitsExpanded = false;   // collapse the visited-places list for the new query
  const run = ++visitsRun;
  try {
    const url = `/api/history?device=${encodeURIComponent(id)}&start=${start}&end=${end}`;
    const hasTrack = render(await (await fetch(url)).json());
    updateExportLinks(id, start, end, hasTrack);
    document.getElementById('export-visits-row').hidden = true;
    if (hasTrack) loadVisits(id, start, end, run, 0);
  } catch (e) {
    setStatus(`<span class="error-row">${t('history_load_error')}</span>`);
  } finally {
    btn.disabled = false;
    btn.textContent = t('show');
  }
}

async function loadVisits(id, start, end, run, attempt) {
  if (run !== visitsRun) return;   // a newer show() superseded this one
  let data;
  try {
    const url = `/api/visits?device=${encodeURIComponent(id)}&start=${start}&end=${end}`;
    data = await (await fetch(url)).json();
  } catch (e) {
    return;
  }
  if (run !== visitsRun) return;
  renderVisits(data);

  // Addresses are geocoded in the background -- refetch a few times to fill
  // in the ones that were still pending.
  if (data.geocoding && data.pending > 0 && attempt < 6) {
    setTimeout(() => loadVisits(id, start, end, run, attempt + 1), 3000);
  }
}

function visitRow(v, n, when, place, pending, marker, data) {
  const row = document.createElement('div');
  row.className = 'visit';
  row.innerHTML = `
    <span class="visit-num">${n}</span>
    <span class="visit-body">
      <span class="visit-place${pending ? ' pending' : ''}">${
        pending ? t('resolving_address') : escapeHtml(place)}</span>
      <span class="visit-when">${when} · ${fmtDuration(v.end - v.start)}</span>
    </span>
    <button type="button" class="icon-btn visit-del" data-i18n-aria="visit_delete" aria-label="Delete this visit">🗑</button>`;
  row.addEventListener('click', () => {
    map.flyTo([v.lat, v.lon], Math.max(map.getZoom(), 16));
    marker.openPopup();
    if (window.matchMedia('(max-width: 640px)').matches) {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  });

  row.querySelector('.visit-del').addEventListener('click', (e) => {
    e.stopPropagation();   // don't also trigger the row's flyTo/openPopup
    const id = document.getElementById('device').value;
    row.classList.add('confirming');
    row.innerHTML = '';
    const q = document.createElement('div');
    q.className = 'visit-confirm';
    q.textContent = t('visit_confirm_q', { place, when, n: v.point_count });
    const go = document.createElement('button');
    go.type = 'button'; go.className = 'btn btn-small btn-danger';
    go.textContent = t('visit_confirm_go');
    const cancel = document.createElement('button');
    cancel.type = 'button'; cancel.className = 'btn btn-small';
    cancel.textContent = t('cancel');
    cancel.addEventListener('click', () => renderVisits(data));
    go.addEventListener('click', async () => {
      go.disabled = cancel.disabled = true;
      let res;
      try {
        res = await fetch(`/api/history?${new URLSearchParams({ device: id, start: v.start, end: v.end })}`,
          { method: 'DELETE' });
      } catch (err) {
        go.disabled = cancel.disabled = false;
        go.textContent = t('login_error');
        return;
      }
      if (!res.ok) {
        go.disabled = cancel.disabled = false;
        go.textContent = t('login_error');
        return;
      }
      show();   // redraws both the track and the visits list
    });
    const actions = document.createElement('div');
    actions.className = 'visit-actions';
    actions.append(go, cancel);
    row.append(q, actions);
  });

  return row;
}

function renderVisits(data) {
  visitLayer.clearLayers();
  const box = document.getElementById('visits');
  const list = document.getElementById('visits-list');
  const visits = data.visits || [];

  box.hidden = false;
  list.innerHTML = '';

  const note = document.getElementById('visits-note');
  note.textContent = data.geocoding ? '' : t('geocoding_disabled');

  document.getElementById('export-visits-row').hidden = !visits.length;

  if (!visits.length) {
    const p = document.createElement('p');
    p.className = 'visits-empty';
    p.textContent = t('no_visits');
    list.appendChild(p);
    return;
  }

  const shown = visitsExpanded ? visits.length : Math.min(VISITS_PAGE, visits.length);

  visits.forEach((v, i) => {
    const n = i + 1;
    const place = v.label || (v.address ? v.address.split(',')[0] : null)
      || `${v.lat.toFixed(4)}, ${v.lon.toFixed(4)}`;
    const pending = !v.label && !v.address && data.geocoding;
    const sameDay = fmtDay(v.start) === fmtDay(v.end);
    const when = sameDay
      ? `${fmtDay(v.start)}, ${fmtClock(v.start)}–${fmtClock(v.end)}`
      : `${fmtDay(v.start)} ${fmtClock(v.start)} – ${fmtDay(v.end)} ${fmtClock(v.end)}`;

    // Every visit keeps its numbered map marker; only the *list* is capped.
    const marker = L.marker([v.lat, v.lon], {
      icon: L.divIcon({ className: 'visit-marker', html: `<span>${n}</span>`,
        iconSize: [24, 24], iconAnchor: [12, 12] }),
    }).addTo(visitLayer).bindPopup(
      `<b>${n}. ${escapeHtml(v.label || place)}</b><br>${when}<br>${fmtDuration(v.end - v.start)}`);

    if (i >= shown) return;

    list.appendChild(visitRow(v, n, when, place, pending, marker, data));
  });

  if (visits.length > shown) {
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'btn btn-small visits-more';
    more.textContent = t('visits_show_more', { n: visits.length - shown });
    more.addEventListener('click', () => { visitsExpanded = true; renderVisits(data); });
    list.appendChild(more);
  }
}

function render(data) {
  layer.clearLayers();
  visitLayer.clearLayers();
  const color = deviceColors.get(data.device) || '#4e9bff';
  const pts = (data.points || []).filter(p => p.latitude != null && p.longitude != null);

  if (!pts.length) {
    setStatus(escapeHtml(t('no_points_in_range')));
    document.getElementById('visits').hidden = true;
    return false;
  }

  const latlngs = pts.map(p => [p.latitude, p.longitude]);

  // The full track -- every point, as one line.
  L.polyline(latlngs, { color, weight: 3, opacity: 0.7 }).addTo(layer);

  // Start and end, emphasised.
  L.circleMarker(latlngs[0], { radius: 7, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 })
    .addTo(layer).bindPopup(`<b>${t('start')}</b><br>${fmtTime(pts[0].time)}`);
  L.circleMarker(latlngs[latlngs.length - 1], { radius: 7, color: '#fff', weight: 2, fillColor: '#fff', fillOpacity: 1 })
    .addTo(layer).bindPopup(`<b>${t('end')}</b><br>${fmtTime(pts[pts.length - 1].time)}`);

  // Intermediate points: skip any within 30 m of the last drawn one so
  // stationary stretches don't bury the map in dots (the line stays whole).
  let last = latlngs[0];
  for (let i = 1; i < pts.length - 1; i++) {
    if (metres(last, latlngs[i]) < 30) continue;
    last = latlngs[i];
    L.circleMarker(latlngs[i], { radius: 3, color, weight: 1, fillColor: color, fillOpacity: 0.6 })
      .addTo(layer).bindPopup(fmtTime(pts[i].time));
  }

  map.fitBounds(latlngs, { ...fitPadding(), maxZoom: 16 });
  setStatus(`${t('locations_count', { n: pts.length })}<br>${fmtTime(pts[0].time)} – ${fmtTime(pts[pts.length - 1].time)}`);
  return true;
}

document.getElementById('to').value = toDateInput(new Date());
document.getElementById('from').value = toDateInput(new Date(Date.now() - 7 * 24 * 3600 * 1000));

document.getElementById('show-btn').addEventListener('click', show);
document.getElementById('device').addEventListener('change', show);
document.getElementById('range-mode').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || b.dataset.value === rangeMode) return;
  rangeMode = b.dataset.value;
  syncDateInputs();
  persistDateState();
  show();
});
document.getElementById('prev-btn').addEventListener('click', () => stepRange(-1));
document.getElementById('next-btn').addEventListener('click', () => stepRange(1));
document.getElementById('anchor').addEventListener('change', (e) => {
  const d = new Date(e.target.value + 'T12:00:00');
  if (isNaN(d)) return;
  anchor = d;
  syncDateInputs();
  persistDateState();
  show();
});
document.getElementById('sheet-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
  setTimeout(() => map.invalidateSize(), 300);
});

// The timeline page has no data poll of its own -- ping the public health
// probe so the poll-failure banner shows here too.
async function pollHealth() {
  try {
    window.FindMyMap.renderPollAlert(await (await fetch('/api/health')).json());
  } catch (e) { /* leave the banner as-is if the probe is unreachable */ }
}

// Re-render the current view when the language changes (labels come via t()).
window.FindMyMap.onLangChange = () => {
  syncDateInputs();
  if (document.getElementById('device').value) show();
  pollHealth();
};

syncDateInputs();
loadDevices().then(show);
pollHealth();
setInterval(pollHealth, 30000);
</script>
</body>
</html>
