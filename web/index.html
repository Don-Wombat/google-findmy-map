<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FindMy Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="app.css" />
<script src="app.js"></script>
</head>
<body>
<div id="poll-alert" class="poll-alert" hidden></div>
<div id="app">
  <div id="map"></div>
  <aside id="sidebar">
    <div id="sidebar-header">
      <button id="sheet-toggle" type="button" data-i18n-aria="toggle_sheet" aria-label="Collapse / expand panel"></button>
      <div class="header-row">
        <h1>FindMy Map</h1>
        <a id="settings-link" class="icon-btn" href="settings.html" data-i18n-aria="settings" aria-label="Settings">⚙</a>
      </div>
      <div id="status" data-i18n="loading">Loading…</div>
      <button id="refresh-btn" class="btn" type="button" data-i18n="refresh">Refresh now</button>
      <a class="btn" href="timeline.html" data-i18n="timeline_link">Timeline →</a>
    </div>
    <ul id="device-list"></ul>
  </aside>
</div>
<datalist id="fmm-groups"></datalist>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([51.1657, 10.4515], 6);

// Standard OpenStreetMap raster tiles (building outlines, paths, full
// detail) -- darkened via the CSS filter on .leaflet-tile-pane above.
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);

const deviceLayer = L.layerGroup().addTo(map);
const markerById = new Map(); // device id -> current-position marker
let hasFitBounds = false;
let palette = [];         // pin colours offered in the editor (from the API)
let lastDevices = [];     // most recent device list, for re-rendering without a fetch
let editState = null;     // { id, name, color, group } while a device editor is open

// Which named groups are collapsed in the list -- also hides their pins on
// the map. Remembered per browser.
const collapsedGroups = new Set((() => {
  try {
    const v = JSON.parse(localStorage.getItem('fmm.collapsedGroups') || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
})());
function persistCollapsedGroups() {
  try {
    localStorage.setItem('fmm.collapsedGroups', JSON.stringify([...collapsedGroups]));
  } catch (e) {}
}

const t = (k, v) => window.FindMyMap.t(k, v);
const loc = () => window.FindMyMap.locale();

function fmtTime(unixSeconds) {
  if (!unixSeconds) return t('unknown');
  return new Date(unixSeconds * 1000).toLocaleString(loc());
}

const ERROR_CODES = ['no_response', 'fetch_failed', 'decryption_failed',
  'no_location_data', 'no_location'];
function errorLabel(code) {
  if (ERROR_CODES.includes(code)) return t('err_' + code);
  return code || t('err_no_location');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// Keep the auto-fit clear of the floating panel (top-right on desktop).
function fitPadding() {
  return window.matchMedia('(min-width: 641px)').matches
    ? { paddingTopLeft: [60, 60], paddingBottomRight: [330, 60] }
    : { padding: [50, 50] };
}

function renderStatus(state) {
  const el = document.getElementById('status');
  const parts = [];
  parts.push(`${t('last_poll')}: ${state.last_poll ? fmtTime(state.last_poll) : t('never')}`);
  if (state.last_error) {
    parts.push(`<span class="error-row">${t('error')}: ${escapeHtml(state.last_error)}</span>`);
  }
  const errored = (state.devices || []).filter(d => d.error);
  if (errored.length) {
    parts.push(`<span class="error-row">${t('devices_without_location', { n: errored.length })}</span>`);
  }
  el.innerHTML = parts.join('<br>');
}

function popupHtml(device) {
  return `
    <b>${escapeHtml(device.name)}</b><br>
    ${t('p_time')}: ${fmtTime(device.time)}<br>
    ${t('p_accuracy')}: ${Math.round(device.accuracy || 0)} m<br>
    ${t('p_status')}: ${escapeHtml(device.status || '–')}<br>
    ${t('p_own_report')}: ${device.is_own_report ? t('yes') : t('no')}
  `;
}

function drawDevice(device) {
  // A collapsed group hides its devices from the map too.
  if (device.group && collapsedGroups.has(device.group)) return [];
  const color = device.color || '#4e9bff';
  const track = (device.history || []).filter(p => p.latitude != null && p.longitude != null);
  const latlngs = track.map(p => [p.latitude, p.longitude]);

  // Connecting line through the last few fixes.
  if (latlngs.length >= 2) {
    L.polyline(latlngs, { color, weight: 3, opacity: 0.6, dashArray: '4 6' })
      .addTo(deviceLayer);
  }
  // Small dots for the older points in the track.
  track.slice(0, -1).forEach(p => {
    L.circleMarker([p.latitude, p.longitude], {
      radius: 3, color, weight: 1, fillColor: color, fillOpacity: 0.5,
    }).addTo(deviceLayer).bindPopup(`${escapeHtml(device.name)}<br>${fmtTime(p.time)}`);
  });

  const points = latlngs.slice();

  if (device.type === 'geo') {
    const latlng = [device.latitude, device.longitude];
    const marker = L.circleMarker(latlng, {
      radius: 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1,
    }).addTo(deviceLayer).bindPopup(popupHtml(device));
    markerById.set(device.id, marker);
    points.push(latlng);
  }

  return points;
}

function focusDevice(id) {
  const marker = markerById.get(id);
  if (!marker) return;
  map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 15));
  marker.openPopup();
  if (window.matchMedia('(max-width: 640px)').matches) {
    document.getElementById('sidebar').classList.add('collapsed');
  }
}

function setRinging(btn, on) {
  clearTimeout(btn._ringTimeout);
  btn.classList.toggle('ringing', on);
  const label = on ? t('stop_ring') : t('ring');
  btn.title = label;
  btn.setAttribute('aria-label', label);
  // Google stops the sound on its own after a while; this just resets the
  // button if the operator never comes back to tap "stop" themselves.
  if (on) btn._ringTimeout = setTimeout(() => setRinging(btn, false), 30000);
}

// Sending the request and the device actually ringing are seconds apart
// (FCM round-trip) -- the "pending" shake starts the instant the tap is
// registered, well before the server responds, so there's never a silent
// gap. flashRingFailed() gives the same kind of inline, no-popup feedback
// for a failed request.
function flashRingFailed(btn) {
  btn.classList.remove('pending');
  btn.classList.add('ring-failed');
  setTimeout(() => btn.classList.remove('ring-failed'), 1500);
}

function mkBtn(label, className, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = className;
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

async function putDeviceSettings(id, name, color, group) {
  const res = await fetch(`/api/devices/${encodeURIComponent(id)}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, color, group }),
  });
  if (!res.ok) throw new Error('save failed');
}

function buildEditor(device) {
  const box = document.createElement('div');
  box.className = 'device-editor';
  box.addEventListener('click', e => e.stopPropagation());

  const nameField = document.createElement('div');
  nameField.className = 'field';
  nameField.innerHTML = `<label>${t('f_name')}</label>`;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = editState.name;
  input.placeholder = device.default_name || '';
  input.addEventListener('input', () => { editState.name = input.value; });
  nameField.appendChild(input);

  const colorField = document.createElement('div');
  colorField.className = 'field';
  colorField.innerHTML = `<label>${t('f_pin_color')}</label>`;
  const swatches = document.createElement('div');
  swatches.className = 'swatches';
  for (const c of palette) {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'swatch';
    sw.style.background = c;
    sw.title = c;
    if (c.toLowerCase() === (editState.color || '').toLowerCase()) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      editState.color = c;
      editState.colorCustom = true;
      swatches.querySelectorAll('.swatch').forEach(s => s.classList.toggle('selected', s === sw));
    });
    swatches.appendChild(sw);
  }
  colorField.appendChild(swatches);

  const groupField = document.createElement('div');
  groupField.className = 'field';
  groupField.innerHTML = `<label>${t('f_group')}</label>`;
  const groupInput = document.createElement('input');
  groupInput.type = 'text';
  groupInput.setAttribute('list', 'fmm-groups');
  // Matches the server-side cap (main.py: group[:40]) so a name is never
  // silently truncated after saving with no feedback.
  groupInput.maxLength = 40;
  groupInput.value = editState.group || '';
  groupInput.addEventListener('input', () => { editState.group = groupInput.value; });
  groupField.appendChild(groupInput);

  const actions = document.createElement('div');
  actions.className = 'editor-actions';
  actions.append(
    mkBtn(t('save'), 'btn btn-primary btn-small', async () => {
      const name = (editState.name || '').trim();
      await putDeviceSettings(
        device.id,
        name === (device.default_name || '') ? '' : name,
        editState.colorCustom ? (editState.color || '') : '',
        (editState.group || '').trim(),
      );
      editState = null;
      await refresh();
    }),
    mkBtn(t('cancel'), 'btn btn-small', () => { editState = null; renderList(lastDevices); }),
    mkBtn(t('reset_default'), 'btn btn-small', async () => {
      await putDeviceSettings(device.id, '', '', '');
      editState = null;
      await refresh();
    }),
  );

  box.append(nameField, colorField, groupField, actions);
  return box;
}

function buildDeviceLi(device) {
  const li = document.createElement('li');

  const row = document.createElement('div');
  row.className = 'device';
  // A semantic fix has no coordinates (nothing to put on the map -- see
  // drawDevice()), so show the place name here instead of just a time.
  const when = device.type === 'semantic' && device.place_name
    ? t('at_place', { place: escapeHtml(device.place_name), time: fmtTime(device.last_location_time) })
    : escapeHtml(device.last_location_time
        ? fmtTime(device.last_location_time)
        : errorLabel(device.error));
  row.innerHTML = `
    <span class="dot" style="background:${device.color || '#4e9bff'}"></span>
    <span class="meta">
      <span class="name">${escapeHtml(device.name)}</span>
      <span class="time${device.last_location_time ? '' : ' error-row'}">${when}</span>
    </span>
    <span class="device-actions">
      <button class="device-ring-btn" type="button" title="${t('ring')}" aria-label="${t('ring')}">&#128276;</button>
      <button class="device-edit-btn" type="button" title="${t('edit')}" aria-label="${t('edit')}">&#9998;</button>
    </span>
  `;
  row.addEventListener('click', () => focusDevice(device.id));
  row.querySelector('.device-edit-btn').addEventListener('click', e => {
    e.stopPropagation();
    editState = (editState && editState.id === device.id)
      ? null
      : {
          id: device.id,
          name: device.name || '',
          color: device.color || '',
          colorCustom: !!device.color_is_custom,
          group: device.group || '',
        };
    renderList(lastDevices);
  });
  row.querySelector('.device-ring-btn').addEventListener('click', async e => {
    e.stopPropagation();
    const btn = e.currentTarget;
    const ringing = btn.classList.contains('ringing');
    btn.disabled = true;
    btn.classList.remove('ring-failed');
    btn.classList.add('pending');   // shakes immediately, before the fetch even resolves
    try {
      const res = await fetch(
        `/api/devices/${encodeURIComponent(device.id)}/ring${ringing ? '/stop' : ''}`,
        { method: 'POST' },
      );
      btn.classList.remove('pending');
      if (res.ok) setRinging(btn, !ringing);
      else flashRingFailed(btn);
    } catch (err) {
      flashRingFailed(btn);
    }
    btn.disabled = false;
  });
  li.appendChild(row);

  if (editState && editState.id === device.id) {
    li.appendChild(buildEditor(device));
  }
  return li;
}

function renderList(devices) {
  const list = document.getElementById('device-list');
  list.innerHTML = '';

  const sorted = devices.slice().sort(
    (a, b) => (b.last_location_time || 0) - (a.last_location_time || 0)
  );

  const named = [...new Set(devices.map(d => d.group).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));

  // Keep the editor's group datalist in sync with the groups in use.
  const dl = document.getElementById('fmm-groups');
  if (dl) dl.innerHTML = named.map(g => `<option value="${escapeHtml(g)}"></option>`).join('');

  // No groups anywhere -> the original flat list, unchanged.
  if (!named.length) {
    for (const device of sorted) list.appendChild(buildDeviceLi(device));
    return;
  }

  const bucket = new Map(named.map(g => [g, []]));
  const ungrouped = [];
  for (const d of sorted) (d.group ? bucket.get(d.group) : ungrouped).push(d);

  const sections = named.map(g => [g, bucket.get(g)]);
  if (ungrouped.length) sections.push([null, ungrouped]);

  for (const [group, items] of sections) {
    const collapsed = group !== null && collapsedGroups.has(group);
    const header = document.createElement('li');
    header.className = 'group-header' + (collapsed ? ' collapsed' : '');
    header.innerHTML = `
      <span class="caret">&#9662;</span>
      <span class="group-name">${escapeHtml(group === null ? t('ungrouped') : group)}</span>
      <span class="group-count">${items.length}</span>`;
    if (group !== null) {
      header.addEventListener('click', () => {
        collapsedGroups.has(group) ? collapsedGroups.delete(group) : collapsedGroups.add(group);
        persistCollapsedGroups();
        redrawFromCache();
      });
    }
    list.appendChild(header);
    if (collapsed) continue;
    for (const device of items) list.appendChild(buildDeviceLi(device));
  }
}

// Redraw the map + list from the cached device list, no fetch. Used when a
// group is collapsed/expanded.
function redrawFromCache() {
  deviceLayer.clearLayers();
  markerById.clear();
  for (const device of lastDevices) drawDevice(device);
  renderList(lastDevices);
}

async function refresh() {
  let state;
  try {
    const res = await fetch('/api/locations');
    state = await res.json();
  } catch (err) {
    document.getElementById('status').innerHTML =
      `<span class="error-row">${t('server_unreachable')}</span>`;
    return;
  }

  renderStatus(state);
  window.FindMyMap.renderPollAlert(state);

  palette = state.palette || [];
  const devices = state.devices || [];
  lastDevices = devices;
  deviceLayer.clearLayers();
  markerById.clear();

  const allPoints = [];
  for (const device of devices) {
    for (const p of drawDevice(device)) allPoints.push(p);
  }

  // Don't rebuild the list while a device editor is open -- it would
  // discard the half-typed name and the input focus.
  if (!editState) renderList(devices);

  if (!hasFitBounds && allPoints.length) {
    map.fitBounds(allPoints, { ...fitPadding(), maxZoom: 15 });
    hasFitBounds = true;
  }
}

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  refreshBtn.textContent = t('refreshing');
  try {
    await fetch('/api/refresh', { method: 'POST' });
    await new Promise(r => setTimeout(r, 2500));
    await refresh();
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = t('refresh');
  }
});

document.getElementById('sheet-toggle').addEventListener('click', () => {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  setTimeout(() => map.invalidateSize(), 300);
});

// Re-render everything (list, popups, status) when the language changes.
window.FindMyMap.onLangChange = () => refresh();

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
