# Configure via a .env file next to this one -- see .env.example.
#
# This service has NO authentication. It is attached only to an external
# reverse-proxy network and publishes no ports. The proxy MUST enforce
# authentication. See SECURITY.md.

services:
  findmy-map:
    # Pull the published image -- no repo clone or local build needed.
    image: ghcr.io/don-wombat/google-findmy-map:0.1.7
    # To build locally instead (e.g. for development), comment out the line
    # above and uncomment the one below:
    # build: .
    container_name: findmy-map
    restart: unless-stopped
    networks:
      - proxy-net
    # findmy-map has an optional built-in login (see SECURITY.md). With it
    # enabled you can publish the port directly instead of going through
    # proxy-net -- but only behind HTTPS. Uncomment and adjust:
    # ports:
    #   - "127.0.0.1:8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - GFM_POLL_INTERVAL_SECONDS=${GFM_POLL_INTERVAL_SECONDS:-120}
      - GFM_NOMINATIM_URL=${GFM_NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      - GFM_GEOCODE_EMAIL=${GFM_GEOCODE_EMAIL:-}
      - GFM_VISIT_RADIUS_M=${GFM_VISIT_RADIUS_M:-100}
      - GFM_VISIT_MIN_MINUTES=${GFM_VISIT_MIN_MINUTES:-15}
      - GFM_HISTORY_RETENTION_DAYS=${GFM_HISTORY_RETENTION_DAYS:-}
      - GFM_POLL_ALERT_AFTER=${GFM_POLL_ALERT_AFTER:-3}
      - GFM_DEVICE_COLORS=${GFM_DEVICE_COLORS:-}
      - GFM_AUTH_DISABLE=${GFM_AUTH_DISABLE:-}
      - GFM_LOGIN_DELAY_MS=${GFM_LOGIN_DELAY_MS:-500}
      # Only shows a "Setup Wizard" link on the settings page when set --
      # point it at wherever the setup-wizard service below is actually
      # reachable from your browser (its own NPM proxy host, typically).
      - GFM_SETUP_WIZARD_URL=${GFM_SETUP_WIZARD_URL:-}
      # The container starts as root and entrypoint.sh chowns /data to
      # PUID:PGID before dropping privileges (see entrypoint.sh). PUID/PGID
      # must also match the owner of GFM_SECRETS_FILE, or the token file
      # can't be read/refreshed once the app is running unprivileged:
      #   stat -c '%u:%g' "$GFM_SECRETS_FILE"
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # SQLite database (history.db) -- persisted on the host so it survives
      # rebuilds. Treat it as sensitive personal data.
      - ${GFM_DATA_DIR:-./data}:/data
      # The single shared secrets.json from your existing GoogleFindMyTools
      # container's data volume -- the SAME file (not a copy), so login
      # tokens stay in sync between both containers. Only this one file is
      # mounted; the rest of the vendored Auth/ package comes from the git
      # clone in the Dockerfile and must NOT be overlaid.
      - ${GFM_SECRETS_FILE}:/app/vendor/Auth/secrets.json:rw
    # No "ports:" on purpose -- reachable only from the reverse proxy on
    # proxy-net, at container port 8080 (see README).

  # ---------------------------------------------------------------------
  # Opt-in: generates secrets.json via an embedded, remote-controlled
  # browser instead of requiring a separately-run GoogleFindMyTools
  # instance. NOT started by plain `docker compose up` -- see README
  # "Getting started" for the exact `--profile setup-wizard` invocation.
  # This is a real, non-headless
  # Chromium with live Google network egress; do not leave it running
  # longer than an actual setup session (see SECURITY.md).
  setup-wizard:
    build:
      context: ./setup
      args:
        GFM_UPSTREAM_REF: ${GFM_UPSTREAM_REF:-d46e952}
    container_name: findmy-map-setup-wizard
    profiles: ["setup-wizard"]
    # Deliberately "no", not unless-stopped: a one-time setup token becomes
    # useless after it's redeemed once, and this container must not
    # silently reappear on a host reboot or a plain `up -d` of the rest of
    # the stack.
    restart: "no"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - GFM_SETUP_TOKEN_TTL=${GFM_SETUP_TOKEN_TTL:-900}
      - GFM_SETUP_RUN_TIMEOUT_SECONDS=${GFM_SETUP_RUN_TIMEOUT_SECONDS:-900}
    volumes:
      # The SAME file as findmy-map's GFM_SECRETS_FILE above -- not a copy.
      # PUID/PGID must match its owner exactly like the main service does.
      - ${GFM_SECRETS_FILE}:/app/vendor/Auth/secrets.json:rw
    networks:
      - proxy-net
    # No "ports:" here either, for the same reason as findmy-map: reachable
    # only via a reverse-proxy host you add for it on demand (see README).

networks:
  proxy-net:
    name: ${PROXY_NETWORK:-proxy-net}
    external: true
